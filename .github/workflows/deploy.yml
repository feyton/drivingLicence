name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The Next.js app (web/) now serves production at driving.feyton.co.rw.
      - name: Deploy Next.js app (production)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: /opt/deploy-scripts/deploy-driving-web.sh
          script_stop: true
          timeout: 600s

      # Legacy Apollo/React app, kept running on :6001 for rollback and still
      # reachable at legacy-driving.feyton.co.rw. Non-blocking.
      - name: Deploy legacy app (rollback target)
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: /opt/deploy-scripts/deploy-driving.sh
          script_stop: true
          timeout: 300s
