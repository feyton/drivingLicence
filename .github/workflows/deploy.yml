name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy legacy app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: /opt/deploy-scripts/deploy-driving.sh
          script_stop: true
          timeout: 300s

      - name: Deploy Next.js app (web)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            if [ -x /opt/deploy-scripts/deploy-driving-web.sh ]; then
              /opt/deploy-scripts/deploy-driving-web.sh
            else
              echo "deploy-driving-web.sh not installed yet — skipping"
            fi
          script_stop: true
          timeout: 600s
