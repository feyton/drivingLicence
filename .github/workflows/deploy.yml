name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy legacy app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: /opt/deploy-scripts/deploy-driving.sh
          script_stop: true
          timeout: 300s

      # Staging deploy of the Next.js app (web/). continue-on-error so a staging
      # build issue never blocks the legacy deploy's status.
      - name: Deploy Next.js app (staging)
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: /opt/deploy-scripts/deploy-driving-web.sh
          script_stop: true
          timeout: 600s
