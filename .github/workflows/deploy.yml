name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy legacy app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: /opt/deploy-scripts/deploy-driving.sh
          script_stop: true
          timeout: 300s

  # The Next.js app (web/) is not yet cut over to production. Its deploy is
  # enabled in a later phase once server env secrets and nginx are configured;
  # deploy/deploy-driving-web.sh is the script that step will run.
